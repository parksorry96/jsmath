name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  node-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jsmath/db-schema db:generate
      - run: pnpm lint
      - run: pnpm test

  python-ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ocr-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [node-lint-and-test, python-ocr]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jsmath/db-schema db:generate
      - run: pnpm build
